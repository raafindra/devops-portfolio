services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    ports:
      - "${APP_PORT}:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=${APP_ENV}
      - REDIS_HOST=redis_cache
    depends_on:
      redis_cache:
        condition: service_healthy
    networks:
      - internal_network
    restart: unless-stopped

  redis_cache:
    image: redis:${REDIS_VERSION}
    container_name: redis_cache
    networks:
      - internal_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  internal_network:
    driver: bridge